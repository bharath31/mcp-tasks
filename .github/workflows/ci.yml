# Deterministic CI: external services are faked or local. This does NOT cover
# live gates (Auth0 tenant, FGA SaaS, Stripe test mode, mainstream MCP clients).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_USER: dogfood,
            POSTGRES_PASSWORD: local-only,
            POSTGRES_DB: postgres,
          }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U dogfood" --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check # build, lint, test: the same command developers run
      # Optional: real OpenFGA run (set OPENFGA_BIN to a downloaded server binary)
  # Real processes, the official MCP Tasks requester and the reviewer page in real Chromium
  # (local OIDC provider, OpenFGA-API fake). Separate job: slower, and needs a browser.
  fullstack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_USER: dogfood,
            POSTGRES_PASSWORD: local-only,
            POSTGRES_DB: postgres,
          }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U dogfood" --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: echo "CHROMIUM_PATH=$(find ~/.cache/ms-playwright -path '*chrome-linux*/chrome' -type f | head -1)" >> "$GITHUB_ENV"
      - run: test -x "$CHROMIUM_PATH"
      - run: npm run test:fullstack
      - run: npm run test:admin
  shopping-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm ci --prefix demo/shopping-agent
      - run: npm ci --prefix integrations/poppy
      - run: npm ci --prefix examples/storefront
      - run: npm run test:shopping
      - run: npm --prefix packages/commerce run build
      - run: npm --prefix integrations/poppy run build
      - run: npm --prefix examples/storefront run build
      - run: npm --prefix demo/shopping-merchant run build
      - run: npm --prefix demo/shopping-merchant test
      - run: npm --prefix demo/shopping-agent run typecheck
      - run: npm --prefix demo/shopping-agent test
      - run: npm --prefix demo/shopping-agent-orchestration run typecheck
      - run: npm --prefix demo/shopping-agent-orchestration test
      - run: npm --prefix demo/shopping-live/web run build
      - run: npm --prefix demo/shopping-live/web test
      - run: npm --prefix demo/shopping-live/worker run build
      - run: npm --prefix demo/shopping-live/worker run typecheck:tests
      - run: npm --prefix examples/storefront exec -- playwright-core install --with-deps chromium
      - name: Fixture browser smoke (actual local backend)
        run: |
          export CHROME_PATH="$(find ~/.cache/ms-playwright -path '*chrome-linux*/chrome' -type f | head -1)"
          test -x "$CHROME_PATH"
          cd examples/storefront
          SHOPPING_FIXTURE=1 NODE_ENV=production npm run fixture > /tmp/fixture-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do grep -q 'Fixture only:' /tmp/fixture-server.log && break; sleep 1; done
          npm run test:fixture-browser
      - name: Shopping live web browser smoke
        run: |
          export CHROME_PATH="$(find ~/.cache/ms-playwright -path '*chrome-linux*/chrome' -type f | head -1)"
          test -x "$CHROME_PATH"
          npm --prefix demo/shopping-live/web run build
          CHROME_PATH="$CHROME_PATH" npm --prefix demo/shopping-live/web run test:browser
