# Deploys the hosted Policy Desk demo (mcp-tasks.dev and nominee.dev) after CI passes on main.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers edit) and CLOUDFLARE_ACCOUNT_ID.
# If OWNER_DATABASE_URL is set, migrations run first as the database owner (the live Worker has
# MIGRATE_ON_REQUEST=false). Worker secrets and Auth0 Actions are not touched here.
# Only runs in the maintainer's repository: a copy made by the Deploy button or a fork deploys
# through Workers Builds (the root wrangler.jsonc), not this workflow.
name: deploy policy-desk
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-policy-desk
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository_owner == 'bharath31' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Migrate (owner role)
        env:
          OWNER_DATABASE_URL: ${{ secrets.OWNER_DATABASE_URL }}
        run: |
          if [ -z "$OWNER_DATABASE_URL" ]; then echo "OWNER_DATABASE_URL not set; skipping migrations"; exit 0; fi
          npx tsx demo/policy-desk/tools/migrate.ts
      - name: Build the web bundle
        run: node demo/policy-desk/web/build.mjs
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: >-
          npx wrangler deploy --config demo/policy-desk/wrangler.jsonc
          --message "main ${SHA::7} via GitHub Actions"
      - name: Health check
        run: |
          verified=0
          for host in mcp-tasks.dev nominee.dev; do
            ok=false
            for i in 1 2 3 4 5 6; do
              rm -f /tmp/healthz
              code=$(curl -s -o /tmp/healthz -w "%{http_code}" "https://$host/healthz" || true)
              echo "$host attempt $i: HTTP $code $(head -c 200 /tmp/healthz 2>/dev/null || true)"
              if [ "$code" = 200 ] && jq -e '.status == "ok"' /tmp/healthz >/dev/null 2>&1; then
                ok=true
                verified=$((verified + 1))
                break
              fi
              # Cloudflare's bot challenge can block GitHub runner IPs.
              if [ "$code" = 403 ] && grep -q "Just a moment" /tmp/healthz; then
                echo "::warning::$host healthz is behind Cloudflare's bot challenge; not checked"
                ok=true
                break
              fi
              sleep 10
            done
            [ "$ok" = true ] || exit 1
          done
          if [ "$verified" -eq 0 ]; then
            echo "::error::Neither hostname returned a verified health response"
            exit 1
          fi
