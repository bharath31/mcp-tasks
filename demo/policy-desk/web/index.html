<!doctype html>
<html lang="en">

    <meta name="color-scheme" content="light" />
    <title>Policy Desk: approvals sandbox</title>
    <meta

      content="Policy Desk: agents ask, people approve"
    />
    <meta
      property="og:description"
      content="Unofficial reference implementation of MCP Tasks with human approvals. A real LLM agent asks for refunds over MCP, policy holds the risky ones, and a person approves that exact operation with an Auth0 passkey. Not an Auth0 product; payments are simulated."
    />

      property="og:image"
      content="https://mcp-tasks.dev/og/policy-desk.png"

    <meta property="og:image:height" content="630" />

    <link rel="stylesheet" href="style.css" />
    <script>
      // Pages on the old hostname are static assets the Worker never sees, so redirect here.
      if (location.hostname === "mcp-tasks.bharath.sh")
        location.replace(
          "https://mcp-tasks.dev" +
            location.pathname +
            location.search +
            location.hash,
        );
      document.documentElement.classList.add("js");
    </script>

  <body>
    <div id="app">
      <div class="boot" role="status">
        <span class="boot-mark" aria-hidden="true"></span>
        <span class="boot-bar" aria-hidden="true"></span>
        <span class="sr">Loading Policy Desk</span>
      </div>
    </div>
