<!doctype html>
<html>
  <body>
    <section id="shop" class="shop">
      <div class="grid">
        <article>
          <div class="product-heading">
            <h3>Paper weight</h3>
            <b>$32.00</b>
          </div>
          <button>Add to cart</button>
        </article>
        <article>
          <div class="product-heading">
            <h3>Daily notebook</h3>
            <b>$16.00</b>
          </div>
          <button disabled>Products load after sign-in</button>
        </article>
        <article>
          <div class="product-heading">
            <h3>Pencil cup</h3>
            <b>$18.00</b>
          </div>
          <button>Add to cart</button>
        </article>
        <article>
          <div class="product-heading">
            <h3>Catchall tray</h3>
            <b>$24.00</b>
          </div>
          <button>Add to cart</button>
        </article>
      </div>
    </section>
    <section id="cart" class="workspace">
      <ul class="cart-list">
        <li>
          <span>Catchall tray $24.00</span>
          <div><button>-</button> <span>2</span> <button>+</button></div>
        </li>
        <li>
          <span>Pencil cup $18.00</span>
          <div><button>-</button> <span>1</span> <button>+</button></div>
        </li>
      </ul>
    </section>
  </body>
</html>
